# Sobe o Boldo com `docker compose up -d --build`.
# A senha vem do arquivo .env (copie de .env.example).
name: boldo

services:
  boldo:
    build: .
    image: boldo:latest
    restart: unless-stopped
    ports:
      - '${PORT:-3210}:3210'
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Sao_Paulo}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:boldo@localhost.invalid}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      # O banco (boldo.db) mora aqui. Não apague este volume: é a sua farmacinha.
      - boldo-data:/data

volumes:
  boldo-data:
