<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Boldo</title>
    <meta
      name="description"
      content="A farmacinha de casa: o que tem, quanto resta e a hora de tomar."
    />
    <meta name="theme-color" content="#F3ECD9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Boldo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script>
      // Antes da primeira pintura, para a tela não piscar clara. A regra completa está em
      // src/lib/theme.ts.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('boldo.tema');
        } catch (e) {}
        var dark =
          choice === 'escuro' ||
          (choice !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
