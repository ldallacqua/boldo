name: Publicar no GitHub Pages

# Publica o app (só os arquivos estáticos) em https://<usuário>.github.io/<repositório>/.
# A API fica no Supabase; o endereço dela vem da variável de repositório BOLDO_API_BASE.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compila o app para a subpasta do Pages
        run: npm run build:web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.BOLDO_API_BASE }}
      - name: Confere se o endereço da API foi configurado
        run: test -n "${{ vars.BOLDO_API_BASE }}"
      # O Pages não conhece as rotas do app: o 404.html devolve o próprio app, que resolve a rota.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
